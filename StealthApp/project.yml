name: Stealth
options:
  bundleIdPrefix: com.stealth
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: NO

targets:
  Stealth:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources/Info.plist
        buildPhase: none
      - path: Resources/Stealth.entitlements
        buildPhase: none
      # Default meeting profiles (Markdown), copied into the bundle as a folder.
      - path: Resources/Profiles
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stealth.app
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/Stealth.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    scheme:
      testTargets:
        - StealthTests

  # Logic tests. Not hosted by the app: the pure (Foundation-only) source files
  # are compiled straight into the test bundle, so tests need no permissions,
  # no API key and no network.
  StealthTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      - path: Sources/Stealth/Support/Config.swift
      - path: Sources/Stealth/Support/DebugLog.swift
      - path: Sources/Stealth/Support/CostMeter.swift
      - path: Sources/Stealth/LLM/QuestionDetector.swift
      - path: Sources/Stealth/LLM/SSEParser.swift
      - path: Sources/Stealth/LLM/SentenceSegmenter.swift
      - path: Sources/Stealth/Stores/TranscriptStore.swift
      - path: Sources/Stealth/Stores/SessionRecord.swift
      - path: Sources/Stealth/Stores/NoteExporter.swift
      - path: Sources/Stealth/Context/ProfileStore.swift
      - path: Sources/Stealth/Context/GoalStore.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stealth.tests
        GENERATE_INFOPLIST_FILE: YES
